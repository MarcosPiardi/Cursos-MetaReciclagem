# version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: eventosmeta-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  web:
    build: .
    container_name: eventosmeta-web-prod
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: db
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    volumes:
      - static_volume_prod:/app/staticfiles_collected
      - media_volume_prod:/app/media
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    container_name: eventosmeta-nginx-prod
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume_prod:/app/staticfiles_collected:ro
      - media_volume_prod:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  postgres_data_prod:
  static_volume_prod:
  media_volume_prod:
