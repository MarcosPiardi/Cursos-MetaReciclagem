# Arquivo: docker-compose-prod.yml
# Caminho: eventosmeta/docker-compose-prod.yml
# Projeto: EventosMeta / MetaReciclagem
# Ambiente: Producao
# Host alvo: 10.30.166.21
# Finalidade: Orquestracao Django + PostgreSQL + Nginx (Producao)
# Atualizacoes:
#  - 29/06/2026 - Versao inicial
#  - 03/07/2026 - Refatoracao e padronizacao
#  - 06/07/2026 - Adicionados healthchecks em db_eventosmeta e web_eventosmeta.
#  - 07/07/2026 - Rede nomeada rede1 e volumes nomeados.
#               - Portas NGINX via stack.env (NGINX_HTTP_PORT, NGINX_HTTPS_PORT).
#               - Logging json-file limitado (10m, 5 arquivos).
#               - Gunicorn workers/threads via ENV (GUNICORN_WORKERS, GUNICORN_THREADS).
#               - Revisao final e padronizacao de nomes prefixados *_eventosmeta_prod.
#  - 03/08/2026 - Corrigidos nomes de variaveis de ambiente para bater com
#                 settings.py (DATABASE_NAME/USER/PASSWORD em vez de
#                 POSTGRES_*; removidas DATABASE_URL/DJANGO_SECRET_KEY/
#                 DJANGO_ALLOWED_HOSTS, que nao existem no settings.py).
#               - Corrigido volume de estaticos para staticfiles_collected
#                 (nome real de STATIC_ROOT no settings.py).
#  - 04/08/2026 - Corrigido mapeamento de porta NGINX (host:container) para
#                 suportar porta customizada (1366) mantendo Nginx interno na 80.
#               - Corrigido healthcheck do Nginx para testar porta 80 interna.
#               - adotado padrao de rede externa rede1 (alinhado com outros sistemas).
#  - 06/08/2026 - Adicionado build no servico web (Portainer builda a imagem
#                 automaticamente se nao existir, em vez de tentar baixar).
#               - Alterado env_file de stack.env para .env.prod (arquivo
#                 que ja existe no projeto, simplifica o deploy via File Browser).
#               - Mantido command: com gunicorn via env vars (lugar correto
#                 para flexibilidade no Portainer). A redundancia com o CMD
#                 do Dockerfile.prod sera resolvida ao editar o Dockerfile.prod.
# =============================================================================

name: eventosmeta_prod

services:
  db_eventosmeta_prod:
    image: postgres:16-alpine
    container_name: db_eventosmeta_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data_eventosmeta_prod:/var/lib/postgresql/data
    networks:
      - rede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web_eventosmeta_prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: eventosmeta_web:prod
    container_name: web_eventosmeta_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      DATABASE_HOST: db_eventosmeta_prod
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    command: >-
      sh -c "gunicorn --bind 0.0.0.0:8000 \
      --workers ${GUNICORN_WORKERS:-3} \
      --threads ${GUNICORN_THREADS:-4} \
      --timeout 120 \
      --graceful-timeout 30 \
      --access-logfile - \
      --error-logfile - \
      config.wsgi:application"
    volumes:
      - static_eventosmeta_prod:/app/staticfiles_collected
      - media_eventosmeta_prod:/app/media
    networks:
      - rede
    depends_on:
      db_eventosmeta_prod:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8000)); s.close()\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx_eventosmeta_prod:
    image: nginx:1.27-alpine
    container_name: nginx_eventosmeta_prod
    restart: always
    environment:
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:-80}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_eventosmeta_prod:/usr/share/nginx/static:ro
      - media_eventosmeta_prod:/usr/share/nginx/media:ro
    networks:
      - rede
    depends_on:
      web_eventosmeta_prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  rede:
    external:
      name: rede1

volumes:
  db_data_eventosmeta_prod:
    name: db_data_eventosmeta_prod
  static_eventosmeta_prod:
    name: static_eventosmeta_prod
  media_eventosmeta_prod:
    name: media_eventosmeta_prod


    