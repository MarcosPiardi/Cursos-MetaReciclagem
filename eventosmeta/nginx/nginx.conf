# Arquivo: nginx/nginx.conf
# Caminho: eventosmeta/nginx/nginx.conf
# Finalidade: Configuracao principal do Nginx (Producao)
# Atualizacoes:
#  - 06/08/2026 - Adicionado server_tokens off (oculta versao do nginx)
#               - Adicionados tipos ao gzip (application/javascript,
#                 application/xml, image/svg+xml)
# =============================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Oculta a versao do nginx nas respostas (seguranca)
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json
               application/javascript application/xml image/svg+xml;
    gzip_min_length 1000;

    include /etc/nginx/conf.d/*.conf;
}



