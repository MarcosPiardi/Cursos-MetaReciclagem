# ============================================================
# Arquivo: teste.conf
# Caminho: eventosmeta/nginx/teste.conf
# Finalidade: Reverse proxy HTTPS (TLS) para o Django (Ambiente de Teste)
# Atualizacoes:
#  - Versao inicial: proxy reverso + estaticos, HTTP na 80,
#                      sob premissa de TLS por proxy externo
#  - 22/09/2026 - HTTPS nativo: TLS na 443 com certificado autoassinado
#                 (eventosmeta.crt/eventosmeta.key), X-Forwarded-Proto https,
#                 removida premissa de proxy externo de TLS
# =============================================================

upstream web {
    server web_eventosmeta_teste:8000;
    keepalive 64;
}

server {
    listen 443 ssl;
    server_name 10.30.166.21 eventosmeta.metareciclagem.org;

    # TLS - certificado autoassinado montado em /etc/nginx/certs (volume do compose)
    ssl_certificate     /etc/nginx/certs/eventosmeta.crt;
    ssl_certificate_key /etc/nginx/certs/eventosmeta.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health/ {
        access_log off;
        return 200 "ok";
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}


