# Arquivo: nginx/prod.conf
# Caminho: eventosmeta/nginx/prod.conf
# Finalidade: Proxy reverso + arquivos estáticos (Produção)
# Observação: SSL/TLS é tratado por um proxy externo, na frente deste
#             Nginx. Este servidor recebe tráfego HTTP já filtrado.

upstream web {
    server web_eventosmeta_prod:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name 10.30.166.21 eventosmeta.metareciclagem.org;

    client_max_body_size 100M;

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health/ {
        access_log off;
        return 200 "ok";
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

