# Arquivo: docker-compose.yml
# Caminho: eventosmeta/docker-compose.yml
# Finalidade: Orquestracao Django + PostgreSQL + Nginx (Desenvolvimento)
# Ambiente otimizado para DESENVOLVIMENTO.
# Atualizacoes:
#  - 29/06/2026 - Versao inicial
#  - 03/07/2026 - Refatoracao e padronizacao
#  - 03/07/2026 - Criação inicial do docker-compose.
#  - 06/07/2026 - Adição do serviço nginx_eventosmeta.
#  - 06/07/2026 - Padronização de nomes prefixados (db/web/nginx_eventosmeta).
#  - 07/07/2026 - Otimização para desenvolvimento:
#                      * healthcheck no web_eventosmeta
#                      * rede nomeada metareciclagem_net
#                      * variáveis de porta via .env (POSTGRES_PORT,
#                        NGINX_PORT, DJANGO_PORT)
#                      * removido backup.sql hardcoded
# =============================================================================

# version: "3.8"

networks:
  metareciclagem_net:
    name: metareciclagem_net
    driver: bridge

volumes:
  pgdata_eventosmeta:
    name: pgdata_eventosmeta
    

services:
  db_eventosmeta:
    image: postgres:15-alpine
    container_name: db_eventosmeta
    restart: unless-stopped
    environment:
      POSTGRES_DB: bdmetareciclagem
      POSTGRES_USER: metareciclagem_user
      POSTGRES_PASSWORD: meta2025@forte
    ports:
      - "${POSTGRES_PORT:-15459}:5432"
    volumes:
      - pgdata_eventosmeta:/var/lib/postgresql/data
    networks:
      - metareciclagem_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metareciclagem_user} -d ${POSTGRES_DB:-bdmetareciclagem}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web_eventosmeta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_eventosmeta
    restart: unless-stopped
    depends_on:
      db_eventosmeta:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-eventosmeta}:${POSTGRES_PASSWORD:-eventosmeta}@db_eventosmeta:5432/${POSTGRES_DB:-eventosmeta}
    ports:
      - "${DJANGO_PORT:-1362}:8000"
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - metareciclagem_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx_eventosmeta:
    image: nginx:alpine
    container_name: nginx_eventosmeta
    restart: unless-stopped
    depends_on:
      web_eventosmeta:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./:/app:ro
    # - web_eventosmeta:/app:ro
    networks:
      - metareciclagem_net
      
  