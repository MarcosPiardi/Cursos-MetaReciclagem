# Arquivo: docker-compose.yml
# Caminho: eventosmeta/docker-compose.yml
# Finalidade: Orquestracao Django + PostgreSQL + Nginx
# Atualizacoes:
#  - 29/06/2026 - Versao inicial

services:

  db:
    image: postgres:16-alpine
    container_name: eventosmeta-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build: .
    container_name: eventosmeta-web
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles_collected
      - media_volume:/app/media
    environment:
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=bdmetareciclagem
      - DATABASE_USER=metareciclagem_user
      - DATABASE_PASSWORD=meta2025@forte
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=10.30.166.21,localhost,127.0.0.1
      - FERNET_KEY=${FERNET_KEY}
      - DJANGO_SETTINGS_MODULE=config.settings
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 8000

  nginx:
    image: nginx:1.27-alpine
    container_name: eventosmeta-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles_collected:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume: