# =============================================================================
# Arquivo: docker-compose-teste.yml
# Caminho: eventosmeta/docker-compose-teste.yml
# Projeto: EventosMeta / MetaReciclagem
# Ambiente: Teste
# Host alvo: 10.30.166.21
# Finalidade: Orquestracao Django + PostgreSQL + Redis + Nginx (Teste, HTTPS TLS)
# Atualizacoes:
#  - 15/09/2026 - Versao inicial copiado de docker-compose-prod.yml
#  - 17/09/2026 - Correcao de referencias (DATABASE_HOST, depends_on) e redis
#  - 22/09/2026 - HTTPS: 1366->443 TLS, volume certs, caminhos absolutos
#  - 22/09/2026 - Removido env_file (Portainer nao acessa /home/mpiardi);
#                 variaveis do Django viram referencias ${...} do painel da stack;
#                 correcao do aviso external.name (name + external: true)
# =============================================================================
name: eventosmeta_teste

services:
  db_eventosmeta_teste:
    image: postgres:16.10-alpine
    container_name: db_eventosmeta_teste
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata_eventosmeta_teste:/var/lib/postgresql/data
    networks:
      - rede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis_eventosmeta_teste:
    image: redis:7-alpine
    container_name: redis_eventosmeta_teste
    restart: always
    expose:
      - 6379
    networks:
      - rede
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web_eventosmeta_teste:
    build:
      context: /home/mpiardi/metareciclagem
      dockerfile: Dockerfile.teste
    image: eventosmeta_web:teste
    container_name: web_eventosmeta_teste
    restart: always
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CACHE_LOCATION: ${CACHE_LOCATION}
      DATABASE_ENGINE: ${DATABASE_ENGINE}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: db_eventosmeta_teste
      DATABASE_PORT: ${DATABASE_PORT}
      LANGUAGE_CODE: ${LANGUAGE_CODE}
      TIME_ZONE: ${TIME_ZONE}
      LOGIN_URL: ${LOGIN_URL}
      LOGIN_REDIRECT_URL: ${LOGIN_REDIRECT_URL}
      LOGOUT_REDIRECT_URL: ${LOGOUT_REDIRECT_URL}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      FERNET_KEY: ${FERNET_KEY}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    command: >-
      sh -c "gunicorn --bind 0.0.0.0:8000 \
      --workers ${GUNICORN_WORKERS:-3} \
      --threads ${GUNICORN_THREADS:-4} \
      --timeout 120 \
      --graceful-timeout 30 \
      --access-logfile - \
      --error-logfile - \
      config.wsgi:application"
    volumes:
      - static_eventosmeta_teste:/app/staticfiles_collected
      - media_eventosmeta_teste:/app/media
    networks:
      - rede
    depends_on:
      db_eventosmeta_teste:
        condition: service_healthy
      redis_eventosmeta_teste:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8000)); s.close()\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx_eventosmeta_teste:
    image: nginx:1.27-alpine
    container_name: nginx_eventosmeta_teste
    restart: always
    ports:
      - "1366:443"
    volumes:
      - /home/mpiardi/metareciclagem/nginx/teste.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/mpiardi/metareciclagem/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/mpiardi/metareciclagem/nginx/certs:/etc/nginx/certs:ro
      - static_eventosmeta_teste:/usr/share/nginx/static:ro
      - media_eventosmeta_teste:/usr/share/nginx/media:ro
    networks:
      - rede
    depends_on:
      web_eventosmeta_teste:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:443/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  rede:
    name: rede1
    external: true

volumes:
  pgdata_eventosmeta_teste:
    name: pgdata_eventosmeta_teste
  static_eventosmeta_teste:
    name: static_eventosmeta_teste
  media_eventosmeta_teste:
    name: media_eventosmeta_teste


    