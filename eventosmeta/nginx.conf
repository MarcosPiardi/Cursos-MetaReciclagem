# ============================================================
# Arquivo: nginx.conf
# Caminho: eventosmeta/nginx.conf
# Finalidade: Configuração do Nginx (proxy reverso + estáticos) - Desenvolvimento
# Atualizações:
#  - 01/08/2026 - Adicionadas diretivas proxy_http_version e
#                 Connection "" para o keepalive do upstream funcionar
# ============================================================

upstream web {
    server web_eventosmeta:8000;
    keepalive 64;
}

server {
    listen 80;
    # server_name 10.30.166.21 localhost 127.0.0.1;
    server_name _;

    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json;
    gzip_min_length 1000;

    location /static/ {
        alias /app/staticfiles_collected/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health/ {
        access_log off;
        return 200 "ok";
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

