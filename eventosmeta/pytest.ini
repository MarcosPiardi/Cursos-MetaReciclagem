[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = apps

addopts = 
python_path = .
    -v
    --strict-markers
    --tb=short
    --cov=apps
    --cov-report=html
    --cov-report=term-missing
    --maxfail=5
    ; --disable-warnings

markers =
    unit: testes unitários (models, services)
    integration: testes de integração (admin, views)
    slow: testes lentos
    smoke: testes de fumaça (validações básicas)

norecursedirs = 
    .git
    .venv
    __pycache__
    *.egg-info
    node_modules

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

    