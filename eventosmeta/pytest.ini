[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test
python_functions = test_*
testpaths = apps

# 1. Movido para fora de addopts e corrigido para "pythonpath"
pythonpath = .

# 2. Mantido apenas as flags de linha de comando aqui
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=apps
    --cov-report=html
    --cov-report=term-missing
    --maxfail=5
    ; --disable-warnings

markers =
    unit: testes unitários (models, services)
    integration: testes de integração (admin, views)
    slow: testes lentos
    smoke: testes de fumaça (validações básicas)

norecursedirs = 
    .git
    .venv
    pycache
    *.egg-info
    node_modules

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

    